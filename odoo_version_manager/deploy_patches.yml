# .github/workflows/flow1.yml
name: Deploy fixes to other versions with rebase main

on:
  push:
    branches:
      - <current_branch>

# minimal permissions: push happens via SSH_PRIVATE_KEY, the token is
# only used by the reusable workflow to create issues on rebase conflicts
permissions:
  contents: read
  issues: write

jobs:
  deploy-subversions:
    uses: Odoo-Ninjas/git-workflows/.github/workflows/deploy_to_subversions.yml@35306346ba697a710c92e37cc7121d9c5f250011 # v9.19
    with:
      branches: <mappings>
      runner_label: <settings.runs_on>
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

