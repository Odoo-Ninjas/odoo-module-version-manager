# .github/workflows/flow1.yml
name: Deploy fixes to other versions

on:
  push:
    branches:
      - <current_branch>

# The reusable workflow (deploy_to_subversions.yml) declares
# `permissions: write-all`. A reusable workflow may never request more
# permissions than the caller grants, so a narrower block here makes the
# run fail at startup ("startup_failure", 0s) before any job runs.
permissions: write-all

jobs:
  deploy-subversions:
    uses: zebroo-tools/git-workflows/.github/workflows/deploy_to_subversions.yml@35306346ba697a710c92e37cc7121d9c5f250011 # v9.19
    with:
      branches: <mappings>
      runner_label: <settings.runs_on>
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

